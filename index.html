<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal SINTRALCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════
   PORTAL SINTRALCI — Design System
   Sindicato de Trabajadores LCI Bogotá
   Tipografía: Syne (headings) + Inter (body)
══════════════════════════════════════════════════════════ */

/* ── VARIABLES ─────────────────────────────────────────── */
:root {
  /* Brand */
  --or:       #e94e1b;
  --or-dk:    #c83d13;
  --or-lt:    #fff3ee;
  --or-glow:  rgba(233,78,27,.14);
  --or-dim:   rgba(233,78,27,.08);

  /* Dark palette (sidebar + login) */
  --ink:      #0d0d0d;
  --ink-1:    #111111;
  --ink-2:    #191919;
  --ink-3:    #252525;
  --ink-4:    #333333;

  /* Content palette */
  --bg:       #f3f1ee;
  --white:    #ffffff;
  --txt:      #1a1818;
  --mid:      #555250;
  --muted:    #8a8582;
  --border:   #e2dfd9;
  --border-lt:#eeece8;

  /* Status */
  --grn:     #16a34a; --grn-bg: #f0fdf4;
  --amb:     #d97706; --amb-bg: #fffbeb;
  --red:     #dc2626; --red-bg: #fef2f2;
  --blue:    #2563eb; --blue-bg:#eff6ff;

  /* Typography */
  --fh: 'Syne', system-ui, sans-serif;
  --fb: 'Inter', system-ui, sans-serif;

  /* Layout */
  --side-w: 244px;
  --top-h:  58px;
  --btm-h:  68px;
  --r:      12px;
  --r-sm:   8px;
  --sh:     0 1px 2px rgba(0,0,0,.04), 0 4px 20px rgba(0,0,0,.07);
  --sh-lg:  0 8px 48px rgba(0,0,0,.14);
  --sh-sm:  0 1px 4px rgba(0,0,0,.09);
}

/* ── RESET ─────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:16px; -webkit-text-size-adjust:100%; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--txt);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── UTILITIES ─────────────────────────────────────────── */
.hidden { display:none !important; }
.flex   { display:flex; }
.col    { flex-direction:column; }
.gap-1  { gap:.5rem; }
.gap-2  { gap:1rem; }
.w-full { width:100%; }
.text-sm    { font-size:.875rem; }
.text-xs    { font-size:.75rem; }
.text-muted { color:var(--muted); }
.text-center{ text-align:center; }
.fw-500 { font-weight:500; }
.fw-600 { font-weight:600; }
.fw-700 { font-weight:700; }
.fw-800 { font-weight:800; }
.mt-1 { margin-top:.5rem; }
.mt-2 { margin-top:1rem; }
.mt-3 { margin-top:1.5rem; }
.mt-4 { margin-top:2rem; }

/* ══════════════════════════════════════════════════════════
   LOGIN SCREEN — dark editorial
══════════════════════════════════════════════════════════ */
#login-screen {
  min-height: 100vh;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.25rem;
  position: relative;
  overflow: hidden;
}

/* Subtle grid texture */
#login-screen::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
/* Ambient orange glow */
#login-screen::after {
  content: '';
  position: absolute;
  top: -120px; right: -120px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(233,78,27,.18) 0%, transparent 65%);
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 368px;
}

.login-card {
  background: none;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
}

/* Brand block — centered vertical */
.login-brand {
  background: none;
  padding: 0;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.25rem;
  margin-bottom: 2.75rem;
}

.login-logo-svg {
  width: 84px;
  height: 84px;
  filter: drop-shadow(0 0 24px rgba(233,78,27,.35));
}

.login-brand-text strong {
  display: block;
  font-family: var(--fh);
  font-size: 3.75rem;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -2px;
  line-height: .95;
}
.login-brand-text span {
  display: block;
  color: rgba(255,255,255,.35);
  font-family: var(--fb);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-top: .875rem;
}

/* Form card (frosted glass on dark) */
.login-body {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  padding: 2rem;
  backdrop-filter: blur(8px);
}

.login-subtitle {
  font-size: .82rem;
  color: rgba(255,255,255,.4);
  margin-bottom: 1.5rem;
  text-align: center;
  line-height: 1.5;
}

/* Dark inputs — override default whites */
.login-body .form-label {
  color: rgba(255,255,255,.5);
  font-size: .72rem;
  letter-spacing: .6px;
  text-transform: uppercase;
}
.login-body .form-control {
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.1);
  color: #ffffff;
}
.login-body .form-control:focus {
  border-color: var(--or);
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 3px rgba(233,78,27,.2);
}
.login-body .form-control::placeholder { color: rgba(255,255,255,.22); }
.login-body .form-error-msg {
  background: rgba(220,38,38,.12);
  border: 1px solid rgba(220,38,38,.25);
  color: #fca5a5;
}
.login-forgot {
  font-size: .76rem;
  color: rgba(255,255,255,.28);
  text-align: center;
  margin-top: 1.25rem;
  line-height: 1.5;
}
.login-footer {
  font-family: var(--fb);
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,.12);
  text-align: center;
  margin-top: 2rem;
}

/* ══════════════════════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════════════════════ */
#app-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════════════
   SIDEBAR — dark, editorial
══════════════════════════════════════════════════════════ */
#sidebar {
  width: var(--side-w);
  background: var(--ink-1);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  overflow: hidden;
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  z-index: 200;
  position: relative;
}

/* Subtle vertical accent line on right edge */
#sidebar::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(233,78,27,.3) 40%, rgba(233,78,27,.1) 100%);
}

#sidebar-brand {
  background: none;
  padding: 1.375rem 1.25rem 1.25rem;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: .875rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.sb-brand-text strong {
  display: block;
  font-family: var(--fh);
  font-size: 1.05rem;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: .5px;
  line-height: 1.1;
}
.sb-brand-text span {
  color: rgba(255,255,255,.3);
  font-size: .62rem;
  letter-spacing: .6px;
  line-height: 1;
  margin-top: .2rem;
  display: block;
}

/* Nav */
#sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: .875rem 0;
}
#sidebar-nav::-webkit-scrollbar { width: 3px; }
#sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

.nav-section-label {
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: rgba(255,255,255,.2);
  padding: .875rem 1.25rem .3rem;
}
.nav-divider {
  height: 1px;
  background: rgba(255,255,255,.06);
  margin: .5rem .875rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .625rem 1.25rem;
  color: rgba(255,255,255,.45);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
  user-select: none;
}
.nav-item:hover {
  background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.8);
}
.nav-item.active {
  background: rgba(233,78,27,.1);
  color: var(--or);
  border-left-color: var(--or);
  font-weight: 600;
}
.nav-item.active .nav-icon { color: var(--or); }
.nav-icon {
  width: 20px;
  text-align: center;
  font-size: .95rem;
  flex-shrink: 0;
  opacity: .9;
}
.nav-badge {
  margin-left: auto;
  background: var(--or);
  color: #fff;
  font-size: .6rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
}

/* User footer */
#sidebar-user {
  border-top: 1px solid rgba(255,255,255,.06);
  padding: .875rem 1.25rem;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: .75rem;
}
.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--or);
  color: #fff;
  font-family: var(--fh);
  font-weight: 700;
  font-size: .85rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  letter-spacing: .5px;
}
.user-info { flex: 1; min-width: 0; }
.user-info strong {
  display: block;
  font-size: .8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: rgba(255,255,255,.8);
}
.user-info span {
  font-size: .68rem;
  color: rgba(255,255,255,.3);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.logout-btn {
  background: none; border: none;
  cursor: pointer;
  padding: .25rem;
  color: rgba(255,255,255,.25);
  font-size: 1rem;
  border-radius: 4px;
  transition: color .15s;
  flex-shrink: 0;
  line-height: 1;
}
.logout-btn:hover { color: var(--or); }

/* ══════════════════════════════════════════════════════════
   MAIN WRAP
══════════════════════════════════════════════════════════ */
#main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow: hidden;
}

#topbar {
  height: var(--top-h);
  background: var(--white);
  border-bottom: 1px solid var(--border-lt);
  display: flex;
  align-items: center;
  gap: .875rem;
  padding: 0 1.5rem;
  flex-shrink: 0;
  z-index: 100;
}
#menu-btn {
  display: none;
  background: none; border: none;
  cursor: pointer;
  font-size: 1.25rem;
  color: var(--muted);
  padding: .25rem;
  border-radius: 6px;
  line-height: 1;
  transition: color .15s;
}
#menu-btn:hover { color: var(--txt); }
#page-title {
  font-family: var(--fh);
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--txt);
  flex: 1;
  letter-spacing: -.3px;
}
#topbar-user {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-size: .8rem;
  color: var(--muted);
}

#view-area {
  flex: 1;
  overflow-y: auto;
  padding: 1.75rem 2rem;
}
#view-area::-webkit-scrollbar { width: 6px; }
#view-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

/* View enter animation */
@keyframes view-enter {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.view-content { animation: view-enter .22s ease; }

/* ══════════════════════════════════════════════════════════
   BOTTOM NAV (mobile)
══════════════════════════════════════════════════════════ */
#btm-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--btm-h);
  background: var(--ink-1);
  border-top: 1px solid rgba(255,255,255,.06);
  z-index: 300;
}
.btm-nav-inner {
  display: flex;
  height: 100%;
}
.btm-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .25rem;
  cursor: pointer;
  color: rgba(255,255,255,.35);
  font-size: .58rem;
  font-weight: 500;
  border: none;
  background: none;
  transition: color .15s;
  padding: .4rem .25rem;
  position: relative;
  letter-spacing: .2px;
}
.btm-item .btm-icon { font-size: 1.15rem; line-height: 1; }
.btm-item.active { color: var(--or); }
.btm-item .btm-badge {
  position: absolute;
  top: .3rem; right: calc(50% - 15px);
  background: var(--or);
  color: #fff;
  font-size: .55rem;
  font-weight: 700;
  min-width: 14px; height: 14px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
}

/* Sidebar overlay (mobile) */
#sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(2px);
  z-index: 190;
}

/* ══════════════════════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  padding: .6rem 1.25rem;
  border-radius: var(--r-sm);
  font-size: .875rem;
  font-weight: 600;
  font-family: var(--fb);
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .15s ease;
  white-space: nowrap;
  text-decoration: none;
  letter-spacing: -.1px;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary   { background: var(--or); color: #fff; border-color: var(--or); }
.btn-primary:hover:not(:disabled)   { background: var(--or-dk); border-color: var(--or-dk); }
.btn-secondary { background: var(--white); color: var(--txt); border-color: var(--border); }
.btn-secondary:hover:not(:disabled) { border-color: var(--or); color: var(--or); }
.btn-success   { background: var(--grn); color: #fff; border-color: var(--grn); }
.btn-success:hover:not(:disabled)   { background: #138f42; }
.btn-danger    { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover:not(:disabled)    { background: #b91c1c; }
.btn-ghost     { background: transparent; color: var(--or); border-color: var(--or); }
.btn-ghost:hover:not(:disabled)     { background: var(--or-lt); }
.btn-dark      { background: var(--ink-1); color: #fff; border-color: var(--ink-1); }
.btn-dark:hover:not(:disabled)      { background: var(--ink-3); }
.btn-sm   { padding: .375rem .875rem; font-size: .8rem; }
.btn-lg   { padding: .75rem 1.75rem; font-size: .95rem; }
.btn-full { width: 100%; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: var(--r-sm); }
.btn .spin {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .65s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════════════════
   FORM ELEMENTS
══════════════════════════════════════════════════════════ */
.form-group { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
.form-group:last-of-type { margin-bottom: 0; }
.form-label {
  font-size: .8rem;
  font-weight: 600;
  color: var(--mid);
}
.form-label .req { color: var(--or); }
.form-control {
  width: 100%;
  padding: .65rem .9rem;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--fb);
  font-size: .875rem;
  color: var(--txt);
  background: var(--white);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.form-control:focus {
  border-color: var(--or);
  box-shadow: 0 0 0 3px var(--or-glow);
}
.form-control:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }
.form-control::placeholder { color: #c5c1bc; }
textarea.form-control { resize: vertical; min-height: 90px; line-height: 1.55; }
select.form-control { cursor: pointer; }
.form-hint { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
.form-error-msg {
  font-size: .8rem;
  color: var(--red);
  font-weight: 600;
  padding: .5rem .75rem;
  background: var(--red-bg);
  border-radius: var(--r-sm);
  display: none;
}
.form-error-msg.show { display: block; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem 1rem; }
.form-grid .span-2 { grid-column: 1 / -1; }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--r);
  padding: 1.5rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  background: var(--bg);
  position: relative;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--or); background: var(--or-lt); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-zone-icon { font-size: 1.75rem; color: var(--muted); }
.upload-zone p { font-size: .82rem; color: var(--muted); margin-top: .35rem; }
.upload-zone small { font-size: .72rem; color: #bbb; }
.img-preview-wrap { position: relative; }
.img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border); display: block; }
.img-remove {
  position: absolute; top: .5rem; right: .5rem;
  background: var(--red); color: #fff;
  border: none; border-radius: 50%; width: 26px; height: 26px;
  cursor: pointer; font-size: .85rem;
  display: flex; align-items: center; justify-content: center;
}

/* ══════════════════════════════════════════════════════════
   CARDS
══════════════════════════════════════════════════════════ */
.card {
  background: var(--white);
  border-radius: var(--r);
  box-shadow: var(--sh);
}
.card-body { padding: 1.5rem; }
.card-sm .card-body { padding: 1rem 1.25rem; }

/* ══════════════════════════════════════════════════════════
   BADGES
══════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .2rem .6rem;
  border-radius: 999px;
  font-size: .7rem;
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: .2px;
}
.badge-or    { background: var(--or-lt);  color: var(--or); }
.badge-grn   { background: var(--grn-bg); color: var(--grn); }
.badge-amb   { background: var(--amb-bg); color: var(--amb); }
.badge-red   { background: var(--red-bg); color: var(--red); }
.badge-blue  { background: var(--blue-bg);color: var(--blue); }
.badge-muted { background: var(--bg);     color: var(--muted); border: 1px solid var(--border); }
.badge-dk    { background: var(--ink-1);  color: #fff; }

/* ══════════════════════════════════════════════════════════
   TABS
══════════════════════════════════════════════════════════ */
.tab-bar {
  display: flex;
  border-bottom: 2px solid var(--border-lt);
  gap: 0;
  margin-bottom: 1.5rem;
}
.tab-btn {
  padding: .6rem 1.125rem;
  font-size: .85rem;
  font-weight: 600;
  font-family: var(--fb);
  color: var(--muted);
  background: none; border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  margin-bottom: -2px;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--txt); }
.tab-btn.active { color: var(--or); border-bottom-color: var(--or); }
.tab-badge {
  background: var(--or-glow);
  color: var(--or);
  border-radius: 999px;
  padding: .05rem .4rem;
  font-size: .62rem;
  font-weight: 700;
  margin-left: .35rem;
}

/* ══════════════════════════════════════════════════════════
   TABLES
══════════════════════════════════════════════════════════ */
.table-wrap { overflow-x: auto; border-radius: var(--r); background: var(--white); box-shadow: var(--sh); }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: .75rem 1.125rem;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
  border-bottom: 1px solid var(--border-lt);
  text-align: left;
  white-space: nowrap;
  background: var(--bg);
}
tbody td {
  padding: .875rem 1.125rem;
  font-size: .875rem;
  border-bottom: 1px solid var(--border-lt);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--or-dim); }
.td-actions { display: flex; gap: .35rem; flex-wrap: wrap; }

/* ══════════════════════════════════════════════════════════
   PAGE HEADER
══════════════════════════════════════════════════════════ */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
}
.page-head-left h2 {
  font-family: var(--fh);
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--txt);
  letter-spacing: -.75px;
  line-height: 1.1;
}
.page-head-left p { font-size: .875rem; color: var(--muted); margin-top: .3rem; }
.page-head-right { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }

/* ══════════════════════════════════════════════════════════
   STATS ROW — editorial big numbers
══════════════════════════════════════════════════════════ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1rem;
  margin-bottom: 1.75rem;
}
.stat-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 1.5rem 1.25rem 1.25rem;
  box-shadow: var(--sh);
  cursor: default;
  transition: transform .2s ease, box-shadow .2s ease;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--sh-lg); }
.stat-card .stat-num {
  font-family: var(--fh);
  font-size: 3rem;
  font-weight: 800;
  line-height: 1;
  color: var(--or);
  letter-spacing: -2px;
}
.stat-card .stat-lbl {
  font-size: .72rem;
  color: var(--muted);
  margin-top: .5rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ══════════════════════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════════════════════ */
.empty {
  text-align: center;
  padding: 4rem 1.5rem;
  color: var(--muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: .875rem; opacity: .6; }
.empty p { font-size: .9rem; color: var(--muted); }

/* ══════════════════════════════════════════════════════════
   CLASSIFIED CARD — editorial grid layout
══════════════════════════════════════════════════════════ */
.cl-card {
  background: var(--white);
  border-radius: var(--r);
  overflow: hidden;
  display: grid;
  grid-template-columns: 140px 1fr;
  box-shadow: var(--sh);
  transition: transform .2s ease, box-shadow .2s ease;
}
.cl-card:hover { transform: translateY(-2px); box-shadow: var(--sh-lg); }
.cl-img {
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.25rem;
  color: var(--border);
  flex-shrink: 0;
  overflow: hidden;
  min-height: 120px;
}
.cl-img img { width: 100%; height: 100%; object-fit: cover; }
.cl-body { padding: 1.125rem 1.25rem; display: flex; flex-direction: column; gap: .4rem; }
.cl-title {
  font-family: var(--fh);
  font-weight: 800;
  font-size: 1rem;
  color: var(--txt);
  letter-spacing: -.3px;
  line-height: 1.25;
  margin-top: .35rem;
}
.cl-desc  { font-size: .82rem; color: var(--muted); line-height: 1.45; }
.cl-meta  { display: flex; flex-wrap: wrap; gap: .5rem; font-size: .72rem; color: var(--muted); margin-top: .2rem; }
.cl-meta span { display: flex; align-items: center; gap: .25rem; }
.cl-actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
.cl-price { font-family: var(--fh); font-weight: 800; color: var(--grn); font-size: 1rem; letter-spacing: -.2px; }

/* ══════════════════════════════════════════════════════════
   PQRS CARD
══════════════════════════════════════════════════════════ */
.pq-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 1.25rem 1.5rem;
  cursor: pointer;
  box-shadow: var(--sh);
  border-left: 3px solid transparent;
  transition: border-color .15s, box-shadow .2s, transform .2s;
}
.pq-card:hover { border-left-color: var(--or); box-shadow: var(--sh-lg); transform: translateX(3px); }
.pq-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.pq-asunto {
  font-family: var(--fh);
  font-weight: 700;
  font-size: 1rem;
  margin-top: .4rem;
  letter-spacing: -.3px;
  color: var(--txt);
}
.pq-desc  { font-size: .82rem; color: var(--muted); margin-top: .3rem; line-height: 1.45; }
.pq-footer { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; flex-wrap: wrap; font-size: .72rem; color: var(--muted); }

/* ══════════════════════════════════════════════════════════
   NEWS CARD — article style
══════════════════════════════════════════════════════════ */
.news-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 1.5rem;
  box-shadow: var(--sh);
  border-left: 3px solid transparent;
  transition: border-color .2s, box-shadow .2s, transform .2s;
  cursor: default;
}
.news-card:hover { border-left-color: var(--or); box-shadow: var(--sh-lg); transform: translateX(3px); }
.news-date {
  font-size: .68rem;
  font-weight: 700;
  color: var(--or);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: .5rem;
}
.news-title {
  font-family: var(--fh);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--txt);
  letter-spacing: -.4px;
  line-height: 1.2;
}
.news-content { font-size: .875rem; color: var(--muted); line-height: 1.6; margin-top: .6rem; }
.news-author  { font-size: .72rem; color: var(--muted); margin-top: .875rem; font-style: italic; }

/* ══════════════════════════════════════════════════════════
   HOME BANNER — dark editorial
══════════════════════════════════════════════════════════ */
.home-banner {
  background: var(--ink-1);
  border-radius: var(--r);
  padding: 2rem 2rem 1.75rem;
  color: var(--white);
  margin-bottom: 1.75rem;
  display: flex;
  align-items: flex-start;
  gap: 1.25rem;
  flex-wrap: wrap;
  position: relative;
  overflow: hidden;
}
/* Ambient glow */
.home-banner::before {
  content: '';
  position: absolute;
  right: -60px; top: -60px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(233,78,27,.25) 0%, transparent 70%);
  pointer-events: none;
}
.home-banner::after {
  content: '';
  position: absolute;
  left: -30px; bottom: -30px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(233,78,27,.1) 0%, transparent 70%);
  pointer-events: none;
}
.home-banner-avatar {
  width: 54px; height: 54px;
  background: var(--or);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fh);
  font-weight: 700; font-size: 1.2rem;
  flex-shrink: 0;
  position: relative;
}
.home-banner-content { flex: 1; position: relative; }
.home-banner h2 {
  font-family: var(--fh);
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.1;
}
.home-banner h2 .name-accent { color: var(--or); }
.home-banner p  { font-size: .82rem; color: rgba(255,255,255,.5); margin-top: .35rem; }
.home-banner-right { margin-left: auto; position: relative; }
.afiliado-badge {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--r-sm);
  padding: .4rem .875rem;
  font-size: .72rem;
  font-weight: 700;
  color: rgba(255,255,255,.6);
  white-space: nowrap;
  letter-spacing: .5px;
}

/* ══════════════════════════════════════════════════════════
   SECTION LABEL
══════════════════════════════════════════════════════════ */
.section-lbl {
  font-size: .68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 1rem;
}

/* ══════════════════════════════════════════════════════════
   RESPONSE BOX
══════════════════════════════════════════════════════════ */
.response-box {
  background: var(--grn-bg);
  border-left: 3px solid var(--grn);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  padding: 1rem 1.125rem;
  margin-top: .875rem;
}
.response-box .resp-label { font-size: .68rem; font-weight: 700; color: var(--grn); text-transform: uppercase; letter-spacing: .8px; }
.response-box .resp-text  { font-size: .875rem; color: var(--txt); margin-top: .4rem; line-height: 1.55; }
.response-box .resp-meta  { font-size: .7rem; color: var(--muted); margin-top: .5rem; }

/* ══════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════ */
#modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 1.25rem;
  animation: fade-in .18s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
#modal-box {
  background: var(--white);
  border-radius: 16px;
  width: 100%; max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.22);
  animation: slide-up .22s ease;
}
@keyframes slide-up { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-head {
  padding: 1.375rem 1.75rem 1.125rem;
  border-bottom: 1px solid var(--border-lt);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.modal-head h3 {
  font-family: var(--fh);
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -.3px;
}
.modal-close {
  background: var(--bg); border: none; cursor: pointer;
  font-size: 1rem; color: var(--muted);
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.modal-close:hover { background: var(--border); color: var(--txt); }
.modal-body { padding: 1.375rem 1.75rem; }
.modal-foot {
  padding: 1.125rem 1.75rem 1.375rem;
  border-top: 1px solid var(--border-lt);
  display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap;
}

/* ══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
#toast-rack {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  z-index: 2000;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  display: flex; align-items: center; gap: .65rem;
  padding: .875rem 1.125rem;
  border-radius: var(--r);
  font-size: .875rem; font-weight: 500;
  min-width: 250px; max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,.18);
  animation: slide-up .22s ease;
  color: #fff;
}
.toast-success { background: var(--grn); }
.toast-error   { background: var(--red); }
.toast-info    { background: var(--or); }

/* ══════════════════════════════════════════════════════════
   PRINT
══════════════════════════════════════════════════════════ */
#print-area { display: none; }
@media print {
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  .print-sheet { width: 216mm; background: #fff; page-break-after: always; margin: 0 auto; }
  .print-half { height: 138mm; display: flex; overflow: hidden; border: 1px solid #ccc; }
  .print-quarter-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 279mm; }
  .print-quarter { border: 1px solid #ccc; padding: 7mm; overflow: hidden; display: flex; flex-direction: column; }
  .cut-line { height: 10px; display: flex; align-items: center; justify-content: center; font-size: 7pt; color: #aaa; font-family: sans-serif; letter-spacing: 2px; border-top: 1px dashed #aaa; }
  .pc-orange-circle { width: 7mm; height: 7mm; border-radius: 50%; background: #e94e1b; display: flex; align-items: center; justify-content: center; }
  .pc-orange-circle span { color: #fff; font-size: 5pt; font-weight: 700; font-family: sans-serif; }
  .pc-brand { display: flex; align-items: center; gap: 2mm; margin-bottom: 3mm; }
  .pc-brand-text { font-size: 6pt; color: #e94e1b; font-weight: 700; font-family: sans-serif; }
  .pc-category { background: #e94e1b; color: #fff; padding: 1mm 3mm; border-radius: 3mm; font-size: 7pt; font-weight: 700; font-family: sans-serif; display: inline-block; margin-bottom: 2mm; }
  .pc-title { font-size: 14pt; font-weight: 800; color: #1a1818; font-family: sans-serif; line-height: 1.2; margin-bottom: 2mm; }
  .pc-title-sm { font-size: 10pt; }
  .pc-price { font-size: 13pt; font-weight: 800; color: #16a34a; font-family: sans-serif; margin-bottom: 2mm; }
  .pc-desc { font-size: 8pt; color: #555; line-height: 1.4; font-family: sans-serif; flex: 1; overflow: hidden; }
  .pc-contact { margin-top: auto; padding-top: 2mm; border-top: 1pt solid #eee; font-family: sans-serif; }
  .pc-contact-label { font-size: 7pt; color: #888; }
  .pc-contact-name  { font-size: 8pt; font-weight: 700; color: #1a1818; }
  .pc-contact-phone { font-size: 8pt; color: #444; }
  .pc-date { font-size: 6pt; color: #aaa; margin-top: 1mm; }
  .pc-img { width: 85mm; background: #f5f5f5; overflow: hidden; flex-shrink: 0; }
  .pc-img img { width: 100%; height: 100%; object-fit: cover; }
  .pc-body { padding: 8mm; flex: 1; display: flex; flex-direction: column; }
}

/* ══════════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  #sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    box-shadow: none;
  }
  #sidebar.open { transform: translateX(0); box-shadow: 8px 0 40px rgba(0,0,0,.4); }
  #sidebar-overlay.open { display: block; }
  #menu-btn  { display: flex; }
  #btm-nav   { display: block; }
  #view-area { padding: 1.25rem 1.125rem calc(var(--btm-h) + 1.25rem); }
  #topbar { padding: 0 1.125rem; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: 1; }
  .page-head { margin-bottom: 1.25rem; }
  .page-head-left h2 { font-size: 1.4rem; }
  .cl-img { min-width: 100px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .home-banner { padding: 1.5rem; }
  .home-banner h2 { font-size: 1.4rem; }
  #topbar-user span { display: none; }
  #toast-rack { right: .75rem; left: .75rem; }
  .toast { min-width: 0; max-width: 100%; }
}
@media (max-width: 480px) {
  .cl-card { grid-template-columns: 1fr; }
  .cl-img  { width: 100%; height: 160px; }
  .stats-row { grid-template-columns: 1fr 1fr; gap: .75rem; }
  .stat-card .stat-num { font-size: 2.5rem; }
  .home-banner { flex-direction: column; gap: 1rem; }
  .home-banner-right { margin-left: 0; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     APP SHELL
════════════════════════════════════════════════ -->
<div id="app-shell" class="hidden">

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-brand"></div>
    <nav id="sidebar-nav"></nav>
    <div id="sidebar-user"></div>
  </aside>

  <!-- MAIN -->
